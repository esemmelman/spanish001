<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palabra — Spanish Study Cards</title>
  <style>
    :root {
      --ink: #17322d;
      --muted: #60736d;
      --cream: #f7f1e5;
      --paper: #fffdf7;
      --coral: #e9634f;
      --coral-dark: #bc4537;
      --teal: #1d7669;
      --line: #d9d2c3;
      --gold: #f2bc55;
      --shadow: 0 24px 60px rgba(35, 48, 42, .15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(242,188,85,.24), transparent 24rem),
        radial-gradient(circle at 90% 86%, rgba(29,118,105,.16), transparent 28rem),
        var(--cream);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.10'/%3E%3C/svg%3E");
    }

    .shell { width: min(1400px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 70px; }

    .control-bar { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
    .page-control { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 1.35rem; font-weight: 850; white-space: nowrap; }
    .page-select { min-width: 112px; min-height: 64px; padding: 8px 36px 8px 18px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--paper); font: inherit; font-size: 1.5rem; font-weight: 800; cursor: pointer; }
    .page-select:focus-visible { outline: 3px solid rgba(242,188,85,.7); outline-offset: 2px; }
    .mode-switch { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; width: 330px; padding: 7px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,253,247,.64); }
    .mode-btn { border: 0; border-radius: 12px; padding: 15px 20px; color: var(--muted); background: transparent; font: inherit; font-size: 1.7rem; font-weight: 750; cursor: pointer; transition: .2s ease; }
    .mode-btn:hover { color: var(--ink); background: rgba(255,255,255,.7); }
    .mode-btn.active { color: white; background: var(--teal); box-shadow: 0 5px 14px rgba(29,118,105,.2); }
    .page-reader-button { flex: 0 0 auto; border: 1px solid var(--line); color: var(--muted); background: white; }
    .page-reader-button:hover { color: var(--ink); background: #f8f5ed; }
    .page-reader-button.active, .page-reader-button.active:hover { border-color: var(--teal); color: white; background: var(--teal); box-shadow: 0 5px 14px rgba(29,118,105,.2); }

    .range-picker { flex: 1; margin: 0; min-width: 0; }
    .range-options { display: flex; flex-wrap: wrap; gap: 11px; }
    .range-option { position: relative; }
    .range-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .range-option label { display: block; padding: 13px 22px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,253,247,.72); font-size: 1.25rem; font-weight: 750; cursor: pointer; transition: .18s ease; }
    .range-option label:hover { border-color: var(--teal); color: var(--ink); }
    .range-option input:checked + label { border-color: var(--coral); color: white; background: var(--coral); box-shadow: 0 4px 12px rgba(233,99,79,.2); }
    .range-option input:focus-visible + label { outline: 3px solid rgba(242,188,85,.7); outline-offset: 2px; }
    .range-option input:disabled + label { border-style: dashed; color: #9c9c94; background: rgba(232,226,215,.48); cursor: not-allowed; opacity: .7; }
    .sync-panel { position: fixed; z-index: 30; top: 10px; left: 10px; margin: 0; }
    .sync-panel summary { width: max-content; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: rgba(255,253,247,.72); font-size: .9rem; font-weight: 800; cursor: pointer; list-style: none; }
    .sync-panel summary::-webkit-details-marker { display: none; }
    .sync-panel summary::before { content: "+ "; color: var(--teal); }
    .sync-panel[open] summary::before { content: "− "; }
    .sync-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; width: min(760px, calc(100vw - 20px)); margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); background: var(--cream); box-shadow: 0 12px 30px rgba(35,48,42,.16); font-size: .95rem; font-weight: 750; }
    .sync-code { width: 245px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--paper); font: inherit; font-size: 1rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .sync-button { padding: 10px 15px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--paper); font: inherit; font-weight: 800; cursor: pointer; }
    .sync-button:hover { border-color: var(--teal); background: #e6f2ef; }
    .sync-status { min-width: 105px; color: var(--teal); }

    main { position: relative; overflow: hidden; min-height: 620px; border: 1px solid rgba(23,50,45,.12); border-radius: 38px; background: rgba(255,253,247,.9); box-shadow: var(--shadow); }
    main::after { content: ""; position: absolute; right: -75px; bottom: -95px; width: 230px; height: 230px; border: 28px solid rgba(233,99,79,.08); border-radius: 50%; pointer-events: none; }
    .panel { position: relative; z-index: 1; display: none; min-height: 620px; padding: clamp(32px, 5vw, 72px); }
    .panel.active { display: flex; flex-direction: column; }
    #flashcardPanel { padding-top: 30px; padding-right: 20px; padding-left: 20px; }
    #flashcardPanel .topline { margin-bottom: 16px; }
    #cardCount { font-size: 2rem; font-weight: 850; }
    #quizPanel { padding-top: 14px; }
    #quizPanel .topline { position: relative; min-height: 100px; }
    #quizScore { font-size: 2.4rem; font-weight: 850; }

    .topline { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 38px; color: var(--muted); font-size: 1.15rem; font-weight: 650; }
    .progress-track { flex: 1; max-width: 380px; height: 10px; overflow: hidden; border-radius: 99px; background: #e8e2d7; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--coral); transition: width .3s ease; }

    .card-wrap { position: relative; perspective: 1200px; display: grid; place-items: start; }
    .card { width: 100%; height: 310px; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1); outline: none; }
    .card.flipped { transform: rotateY(180deg); }
    .card:focus-visible { outline: 4px solid rgba(242,188,85,.65); outline-offset: 7px; border-radius: 25px; }
    .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; border-radius: 32px; backface-visibility: hidden; text-align: center; }
    .front { color: white; background: var(--teal); box-shadow: 0 18px 32px rgba(29,118,105,.2); }
    .back { transform: rotateY(180deg); color: var(--ink); border: 2px solid var(--gold); background: #fff8e8; box-shadow: 0 18px 32px rgba(80,62,28,.12); }
    .word { max-width: 100%; overflow-wrap: anywhere; font-family: Georgia, "Times New Roman", serif; font-size: clamp(5.5rem, 12vw, 11rem); line-height: .92; letter-spacing: -.055em; }
    .translation { max-width: 100%; overflow-wrap: anywhere; font-family: Georgia, "Times New Roman", serif; font-size: clamp(4.5rem, 9vw, 8.5rem); line-height: .98; letter-spacing: -.035em; }
    .group-end { position: absolute; z-index: 5; inset: 0; display: none; place-items: center; overflow: hidden; padding: 24px; border-radius: 32px; background: radial-gradient(circle at 50% 45%, #fff1bd 0 2%, transparent 3%), linear-gradient(135deg, #173f38, var(--teal) 58%, #1e8978); text-align: center; }
    .group-end::before, .group-end::after { content: ""; position: absolute; width: 210px; height: 210px; border: 24px solid rgba(242,188,85,.35); border-radius: 50%; }
    .group-end::before { top: -115px; left: -70px; }
    .group-end::after { right: -75px; bottom: -125px; border-color: rgba(233,99,79,.45); }
    .group-end.show { display: grid; }
    .group-end.show .group-end-content { animation: groupComplete .45s cubic-bezier(.2,.8,.2,1) both; }
    .group-end-content { position: relative; z-index: 1; display: grid; place-items: center; width: min(570px, 92%); min-height: 180px; padding: 28px 34px; border: 3px solid var(--gold); border-radius: 26px; color: var(--ink); background: var(--paper); box-shadow: 0 18px 45px rgba(9,39,34,.35); }
    .group-end-title { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 7vw, 6rem); font-weight: 800; line-height: .9; letter-spacing: -.04em; }
    @keyframes groupComplete { from { opacity: 0; transform: scale(.72) rotate(-3deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    .nav-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; margin-top: 30px; }
    .nav-control { min-height: 88px; padding: 18px 36px; border: 1px solid var(--line); border-radius: 20px; color: var(--ink); background: var(--paper); font: inherit; font-size: 2rem; font-weight: 800; cursor: pointer; transition: .2s ease; }
    .nav-control:hover { border-color: var(--teal); color: white; background: var(--teal); transform: translateY(-2px); }
    #previousCard { grid-column: 1; justify-self: start; min-width: 230px; }
    #nextCard { grid-column: 2; justify-self: center; min-width: 440px; min-height: 112px; border-color: #ddb85d; background: #f8dfa0; font-size: 2.4rem; box-shadow: 0 10px 24px rgba(173,130,31,.16); }
    #nextCard:hover { border-color: #c99a2f; color: var(--ink); background: #efc963; font-size: 2.4rem; font-weight: 800; }

    .quiz-heading { margin: 10px 0 12px; color: var(--muted); font-size: 1rem; font-weight: 850; letter-spacing: .15em; text-align: center; text-transform: uppercase; }
    .quiz-word { position: absolute; left: 50%; margin: 0; transform: translateX(-50%); font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 6vw, 6rem); font-weight: 800; line-height: .92; letter-spacing: -.045em; text-align: center; white-space: nowrap; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: min(960px, 100%); margin: 0 auto; }
    .choice { min-height: 150px; padding: 22px 25px; border: 1px solid var(--line); border-radius: 21px; color: var(--ink); background: white; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 6vw, 6rem); font-weight: 500; line-height: .95; cursor: pointer; transition: .18s ease; }
    .choice:hover:not(:disabled) { border-color: var(--teal); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(23,50,45,.08); }
    .choice.correct { border-color: #3b8b6f; color: #17543f; background: #dff2e9; }
    .choice.success-label { position: relative; padding-top: 46px; }
    .choice.success-label::after { content: "Correct"; position: absolute; top: 14px; right: 18px; padding: 7px 12px; border-radius: 999px; color: white; background: #249a67; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1.05rem; font-weight: 900; line-height: 1; letter-spacing: .04em; animation: correctPulse .7s ease-in-out infinite alternate; }
    .choice.flash-correct { animation: flashCorrect 1.25s ease-in-out 1; }
    .choice.wrong { border-color: #d76353; color: #8c3027; background: #fbe2dd; }
    .choice.dim { opacity: .55; }
    @keyframes flashCorrect {
      0%, 28%, 56%, 84%, 100% { color: #17543f; background: #dff2e9; box-shadow: none; opacity: 1; }
      14%, 42%, 70% { color: white; background: #249a67; box-shadow: 0 0 0 8px rgba(36,154,103,.18), 0 0 30px rgba(36,154,103,.5); opacity: 1; }
    }
    @keyframes correctPulse {
      from { transform: scale(1); box-shadow: 0 0 0 0 rgba(36,154,103,.2); }
      to { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(36,154,103,.14); }
    }
    .feedback { min-height: 76px; display: grid; place-items: center; margin-top: 26px; color: var(--muted); font-size: 1.18rem; font-weight: 750; text-align: center; }
    .feedback.good { color: #217255; }
    .feedback.bad { color: #b3473b; }
    .quiz-result { position: absolute; z-index: 4; inset: 0; display: none; place-items: center; padding: 40px; background: var(--paper); text-align: center; }
    .quiz-result.show { display: grid; }
    .result-label { margin: 0 0 12px; color: var(--muted); font-size: 1rem; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .result-score { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(5rem, 12vw, 10rem); font-weight: 800; line-height: 1; }
    .result-message { margin: 24px 0 0; color: var(--teal); font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.2rem, 5vw, 4.5rem); font-weight: 700; }
    .quiz-result.fail .result-message { color: var(--coral-dark); }

    .page-reader { position: fixed; inset: 0; width: 100vw; max-width: none; height: 100vh; height: 100dvh; max-height: none; overflow-x: hidden; margin: 0; padding: 0; border: 0; border-radius: 0; color: #101714; background: #fffef9; }
    .page-reader::backdrop { background: rgba(10,28,25,.72); }
    .reader-header { position: sticky; z-index: 2; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 28px; color: white; background: var(--teal); }
    .reader-heading { margin: 0; font-size: clamp(2rem, 5vw, 3.4rem); }
    .reader-close { min-width: 120px; padding: 13px 20px; border: 3px solid white; border-radius: 14px; color: white; background: transparent; font: inherit; font-size: 1.35rem; font-weight: 900; cursor: pointer; }
    .reader-close:hover { color: var(--ink); background: white; }
    .reader-content { min-width: 0; overflow-x: hidden; padding: clamp(28px, 5vw, 64px); font-size: clamp(1.85rem, 3vw, 2.45rem); line-height: 1.55; }
    .reader-content h2 { margin: 1.4em 0 .45em; color: #9d3328; font-size: 1.65em; line-height: 1.1; }
    .reader-content h2:first-child { margin-top: 0; }
    .reader-content h3 { margin: 1.2em 0 .35em; color: #155f54; font-size: 1.3em; line-height: 1.15; }
    .reader-content p, .reader-content ul, .reader-content ol { margin: .6em 0; }
    .reader-content p, .reader-content li { font-size: 1.08em; }
    .reader-content li { margin: .5em 0; }
    .reader-content blockquote { margin: .8em 0; padding: .5em .8em; border-left: 8px solid var(--gold); background: #fff6dc; }
    .reader-table-wrap { overflow-x: auto; margin: .8em 0 1.3em; }
    .reader-content table { width: 100%; border-collapse: collapse; font-size: .95em; }
    .reader-content th, .reader-content td { padding: .45em .6em; border: 3px solid #9b382e; text-align: left; }
    .reader-content th { color: white; background: #9b382e; }
    .conjugation-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; margin: .8em 0 1.3em; }
    .conjugation-grid table { height: max-content; margin: 0; }
    .conjugation-grid td { width: 50%; overflow-wrap: anywhere; }
    .conjugation-grid th[colspan] { font-size: 1.15em; text-align: center; }
    .reader-content, .reader-content h2, .reader-content h3, .reader-content p, .reader-content li, .reader-content blockquote, .reader-content table, .reader-content th, .reader-content td, .reader-content strong, .reader-content em {
      color: #a73429;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2.8rem, 6vw, 4rem);
      font-style: normal;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.025em;
    }
    .reader-content th { background: #fffef9; }
    .reader-content p:nth-of-type(4n + 1) { color: #a73429; }
    .reader-content p:nth-of-type(4n + 2) { color: #111; }
    .reader-content p:nth-of-type(4n + 3) { color: #17685a; }
    .reader-content p:nth-of-type(4n) { color: #9a6b00; }
    .reader-content p strong, .reader-content p em { color: inherit; }

    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 24px; color: var(--muted); font-size: 1rem; }
    kbd { padding: 2px 6px; border: 1px solid #cfc8ba; border-bottom-width: 2px; border-radius: 5px; background: #fffaf0; font-family: inherit; }

    @media (max-width: 680px) {
      .shell { padding-top: 26px; }
      .control-bar { align-items: stretch; flex-direction: column; }
      .mode-switch { width: 100%; }
      .page-reader-button { width: 100%; }
      .sync-code { width: 100%; }
      main, .panel { min-height: 650px; }
      #flashcardPanel .topline { margin-bottom: 14px; }
      .card { width: 100%; height: 280px; }
      .face { padding: 24px 18px; }
      .word { font-size: clamp(2.4rem, 11vw, 4.5rem); line-height: 1; }
      .translation { font-size: clamp(2rem, 9.5vw, 3.8rem); line-height: 1.05; }
      .nav-row { display: flex; justify-content: space-between; gap: 12px; }
      .nav-control, #previousCard, #nextCard { min-width: 0; flex: 1; padding-right: 15px; padding-left: 15px; font-size: 1.4rem; }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 70px; }
      footer { display: block; line-height: 1.7; }
      .reader-header { padding: 15px 18px; }
      .reader-close { min-width: 90px; padding: 10px 14px; }
      .reader-content { padding: 26px 20px 44px; }
      .conjugation-grid tbody tr { display: block; }
      .conjugation-grid td { display: block; width: 100%; }
      .conjugation-grid td + td { border-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="control-bar">
      <button class="mode-btn page-reader-button" id="pageReaderButton" type="button" aria-haspopup="dialog">Page</button>
      <label class="page-control" for="pageSelect">
        Page No.
        <select class="page-select" id="pageSelect" aria-label="Page number">
          <option value="1">1</option>
        </select>
      </label>

      <nav class="mode-switch" aria-label="Study mode">
        <button class="mode-btn active" id="flashcardButton" type="button">Flashcard</button>
        <button class="mode-btn" id="quizButton" type="button">Quiz</button>
      </nav>

      <fieldset class="range-picker" style="border:0;padding:0" aria-label="Choose a word group">
        <div class="range-options" id="rangeOptions"></div>
      </fieldset>
    </div>

    <details class="sync-panel">
      <summary>Sync</summary>
      <div class="sync-bar" aria-label="Cross-device progress sync">
        <label for="syncCode">Sync Code</label>
        <input class="sync-code" id="syncCode" maxlength="24" autocomplete="off" spellcheck="false" aria-describedby="syncStatus">
        <button class="sync-button" id="useSyncCode" type="button">Use Code</button>
        <button class="sync-button" id="copySyncCode" type="button">Copy</button>
        <button class="sync-button" id="newSyncCode" type="button">New Code</button>
        <span class="sync-status" id="syncStatus" aria-live="polite">Connecting…</span>
      </div>
    </details>

    <main>
      <section class="panel active" id="flashcardPanel" aria-labelledby="flashcardButton">
        <div class="topline">
          <span id="cardCount">1 of 10</span>
        </div>
        <div class="card-wrap">
          <div class="card" id="card" role="button" tabindex="0" aria-label="Flip flashcard">
            <div class="face front">
              <span class="word" id="spanishWord"></span>
            </div>
            <div class="face back">
              <span class="translation" id="englishWord"></span>
            </div>
          </div>
          <div class="group-end" id="groupEnd" role="status" aria-live="assertive">
            <div class="group-end-content">
              <p class="group-end-title">End of Deck</p>
            </div>
          </div>
        </div>
        <div class="nav-row">
          <button class="nav-control" id="previousCard" type="button">← Previous</button>
          <button class="nav-control" id="nextCard" type="button">Next →</button>
        </div>
      </section>

      <section class="panel" id="quizPanel" aria-labelledby="quizButton">
        <div class="topline">
          <span id="quizScore">Score 0 / 0</span>
          <h2 class="quiz-word" id="quizWord"></h2>
        </div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="quiz-result" id="quizResult" aria-live="assertive">
          <div>
            <p class="result-label">Quiz complete</p>
            <p class="result-score" id="resultScore"></p>
            <p class="result-message" id="resultMessage"></p>
          </div>
        </div>
      </section>
    </main>

    <dialog class="page-reader" id="pageReader" aria-labelledby="readerHeading">
      <header class="reader-header">
        <h1 class="reader-heading" id="readerHeading">Page 1</h1>
        <button class="reader-close" id="readerClose" type="button">Close</button>
      </header>
      <article class="reader-content" id="readerContent"></article>
    </dialog>

    <footer>
      <span><strong id="wordTotal">72</strong> unique words · accents preserved · v1.3.8</span>
      <span id="dataStatus">Loading Page 1 from Supabase…</span>
    </footer>
  </div>

  <script>
    const readingPages = {
      1: `
        <h2>Para empezar</h2>
        <h3>Chapter Objectives — Communication</h3>
        <p>By the end of <em>Para empezar</em> you will be able to:</p>
        <ul><li>Talk about your daily life.</li><li>Write about leisure and after-school activities.</li></ul>
        <p><strong>You will demonstrate what you know and can do:</strong></p>
        <ul><li>Presentación oral: Mi vida</li><li>Presentación escrita: Actividades en mi comunidad</li></ul>
        <h3>1. Tu vida diaria</h3>
        <ul><li>Talk about school and non-school daily activities.</li><li>Describe your day before and after school.</li></ul>
        <h3>2. Días especiales</h3>
        <ul><li>Talk about weekend activities.</li><li>Discuss special events, celebrations, and vacations.</li></ul>
        <h2>Arte y cultura — España</h2>

        if (nextInput) {
          nextInput.disabled = false;
          nextInput.nextElementSibling.removeAttribute("title");
        }
        saveStudyState();
        return true;
      }
      return false;
    }

    function selectGroup(start) {
      groupStart = start;
      activeWords = wordGroups[Math.floor(start / 10)];
      deck = [...activeWords];
      cardIndex = 0;
      score = 0;
      answered = 0;
      locked = false;
      quizQueue = shuffleQuizWords(activeWords);
      saveStudyState();
      $("#quizScore").textContent = "Score 0 / 0";
      renderCard();
      if (quizPanel.classList.contains("active")) newQuestion();
    }

    function setMode(mode) {
      const isCards = mode === "cards";
      const enteringQuiz = !isCards && !quizPanel.classList.contains("active");
      flashcardButton.classList.toggle("active", isCards);
      quizButton.classList.toggle("active", !isCards);
      flashcardButton.setAttribute("aria-pressed", isCards);
      quizButton.setAttribute("aria-pressed", !isCards);
      flashcardPanel.classList.toggle("active", isCards);
      quizPanel.classList.toggle("active", !isCards);
      if (enteringQuiz) {
        if (answered === 0) quizQueue = shuffleQuizWords(activeWords);
        newQuestion();
      }
    }

    function renderReadingPage() {
      const pageNumber = Number($("#pageSelect").value);
      $("#readerHeading").textContent = `Page ${pageNumber}`;
      $("#readerContent").innerHTML = readingPages[pageNumber] || "<h2>Page unavailable</h2><p>No large-print page has been prepared for this page number.</p>";
      $("#pageReader").scrollTop = 0;
    }

    function openReadingPage() {
      renderReadingPage();
      $("#pageReaderButton").classList.add("active");
      const reader = $("#pageReader");
      reader.showModal();
      window.requestAnimationFrame(() => reader.scrollTo({ top: 0, left: 0, behavior: "instant" }));
    }

    function renderCard() {
      hideGroupEnd();
      card.classList.remove("flipped");
      $("#spanishWord").textContent = deck[cardIndex][0];
      $("#englishWord").textContent = deck[cardIndex][1];
      $("#cardCount").textContent = `${cardIndex + 1} of ${deck.length}`;
    }

    function moveCard(direction) {
      if (direction > 0 && cardIndex === deck.length - 1) {
        showGroupEnd(() => {
          cardIndex = 0;
          renderCard();
        });
        return;
      }
      hideGroupEnd();
      cardIndex = (cardIndex + direction + deck.length) % deck.length;
      renderCard();
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function shuffleQuizWords(array) {
      const shuffled = shuffle(array);
      if (shuffled.length > 1 && shuffled.every((item, index) => item === array[index])) {
        shuffled.push(shuffled.shift());
      }
      return shuffled;
    }

    function hideGroupEnd() {
      window.clearTimeout(groupEndTimer);
      $("#groupEnd").classList.remove("show");
    }

    function showGroupEnd(afterHide) {
      const groupEnd = $("#groupEnd");
      window.clearTimeout(groupEndTimer);
      groupEnd.classList.add("show");
      groupEndTimer = window.setTimeout(() => {
        groupEnd.classList.remove("show");
        if (afterHide) afterHide();
      }, 2000);
    }

    function flipCard() {
      const isFlippingToBack = !card.classList.contains("flipped");
      card.classList.toggle("flipped");
      if (isFlippingToBack && cardIndex === deck.length - 1) {
        showGroupEnd();
      }
    }

    function newQuestion() {
      locked = false;
      if (quizQueue.length === 0) quizQueue = shuffleQuizWords(activeWords);
      quizCurrent = quizQueue.shift();
      const distractorPool = shuffle(words.filter(item => item[1] !== quizCurrent[1]));
      const options = shuffle([quizCurrent, ...distractorPool.slice(0, 3)]);
      $("#quizWord").textContent = quizCurrent[0];
      $("#feedback").className = "feedback";
      $("#feedback").textContent = "";
      $("#choices").replaceChildren(...options.map(item => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = item[1];
        button.dataset.correct = String(item[1] === quizCurrent[1]);
        button.addEventListener("click", () => answerQuestion(button));
        return button;
      }));
    }

    function answerQuestion(selected) {
      if (locked) return;
      locked = true;
      answered++;
      const correct = selected.dataset.correct === "true";
      if (correct) score++;
      document.querySelectorAll(".choice").forEach(button => {
        button.disabled = true;
        if (button.dataset.correct === "true") {
          button.classList.add("correct");
          if (!correct) button.classList.add("flash-correct");
          if (correct && button === selected) button.classList.add("success-label");
        }
        else if (button === selected) button.classList.add("wrong");
        else button.classList.add("dim");
      });
      $("#quizScore").textContent = `Score ${score} / ${answered}`;
      const feedback = $("#feedback");
      feedback.className = `feedback ${correct ? "good" : "bad"}`;
      const roundSize = activeWords.length;
      const passingScore = Math.ceil(roundSize * .8);
      const roundComplete = answered === roundSize;
      feedback.textContent = correct ? "" : `Not quite — ${quizCurrent[0]} means “${quizCurrent[1]}.”`;
      if (roundComplete) {
        const passed = score >= passingScore;
        window.setTimeout(() => {
          const newlyUnlocked = passed && unlockNextGroup();
          const result = $("#quizResult");
          $("#resultScore").textContent = `${score} / ${roundSize}`;
          $("#resultMessage").textContent = passed
            ? "Very good! Let's continue."
            : "Sorry, score too low to continue.";
          result.className = `quiz-result show ${passed ? "pass" : "fail"}`;
          window.setTimeout(() => {
            result.className = "quiz-result";
            if (passed) {
              const destinationStart = newlyUnlocked ? unlockedGroup * 10 : groupStart;
              const destinationInput = document.querySelector(`[name="wordRange"][value="${destinationStart}"]`);
              if (destinationInput) destinationInput.checked = true;
              setMode("cards");
              selectGroup(destinationStart);
              return;
            }
            score = 0;
            answered = 0;
            quizQueue = shuffleQuizWords(activeWords);
            $("#quizScore").textContent = "Score 0 / 0";
            newQuestion();
          }, 3000);
        }, correct ? 1000 : 1600);
      } else {
        window.setTimeout(newQuestion, 1350);
      }
    }

    flashcardButton.addEventListener("click", () => setMode("cards"));
    quizButton.addEventListener("click", () => setMode("quiz"));
    $("#pageReaderButton").addEventListener("click", openReadingPage);
    $("#readerClose").addEventListener("click", () => $("#pageReader").close());
    $("#pageReader").addEventListener("close", () => $("#pageReaderButton").classList.remove("active"));
    $("#pageReader").addEventListener("click", event => {
      if (event.target === event.currentTarget) event.currentTarget.close();
    });
    $("#pageSelect").addEventListener("change", event => {
      loadPage(event.target.value);
      if ($("#pageReader").open) renderReadingPage();
    });
    $("#syncCode").addEventListener("input", event => { event.target.value = formatSyncCode(event.target.value); });
    $("#useSyncCode").addEventListener("click", () => connectSyncCode($("#syncCode").value));
    $("#copySyncCode").addEventListener("click", async () => {
      await navigator.clipboard.writeText(formatSyncCode(syncCode));
      $("#syncStatus").textContent = "Copied";
    });
    $("#newSyncCode").addEventListener("click", async () => {
      await connectSyncCode(createSyncCode(), false);
      scheduleCloudSave();
    });
    window.addEventListener("focus", refreshCloudState);
    card.addEventListener("click", flipCard);
    card.addEventListener("keydown", event => {
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        flipCard();
      }
    });
    $("#previousCard").addEventListener("click", () => moveCard(-1));
    $("#nextCard").addEventListener("click", () => moveCard(1));
    document.addEventListener("keydown", event => {
      if (!flashcardPanel.classList.contains("active")) return;
      if (event.key === "ArrowLeft") moveCard(-1);
      if (event.key === "ArrowRight") moveCard(1);
    });

    buildRangeOptions();
    renderCard();
    initializeSync().then(loadPages);
  </script>
</body>
</html>
